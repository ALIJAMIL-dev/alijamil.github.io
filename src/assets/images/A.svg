<?xml version="1.0" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="274" height="274" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7A18" />
      <stop offset="60%" stop-color="#FF3D81" />
      <stop offset="100%" stop-color="#6B46FF" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- outlined triangle (hollow A) -->
  <path d="M50 180 L100 30 L150 180 Z" fill="none" stroke="url(#g)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" filter="url(#shadow)" />

  <!-- subtle crossbar using the logo gradient to match the brand colors -->
  <rect x="70" y="118" width="60" height="10" rx="3" fill="url(#g)" opacity="0.98" />

  <!-- small inverted triangle cutout for clearer 'A' shape; use gradient to match the logo colors -->
  <path d="M86 120 L100 96 L114 120 Z" fill="url(#g)" opacity="1" />
</svg>