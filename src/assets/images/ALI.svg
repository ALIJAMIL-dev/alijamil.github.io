<?xml version="1.0" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" width="340" height="200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="ALI logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7A18" />
      <stop offset="60%" stop-color="#FF3D81" />
      <stop offset="100%" stop-color="#6B46FF" />
    </linearGradient>
  </defs>

  <!-- Outlined 'A' (left) -->
  <g transform="translate(0,0)">
    <path d="M30 180 L90 30 L150 180 Z" fill="none" stroke="url(#g)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" />
    <rect x="82" y="118" width="36" height="8" rx="2" fill="url(#g)" />
    <path d="M96 120 L105 102 L114 120 Z" fill="url(#g)" />
  </g>

  <!-- 'l' and 'i' as text (right) -->
  <g font-family="Coolvetica, Arial, Helvetica, sans-serif" font-weight="700" fill="#ffffff" font-size="88" text-anchor="start" dominant-baseline="middle">
    <text x="180" y="120">l</text>
    <text x="220" y="120">i</text>
  </g>
</svg>